# Dependabot config — keeps pinned dependencies current without
# letting them rot. Three ecosystems covered:
#
#   1. pip          — pyproject.toml + requirements{,-dev}.lock
#   2. docker       — Dockerfile base image + docker-compose images
#   3. github-actions — every action SHA pinned in .github/workflows/
#
# Cadence is weekly. Minor + patch updates are grouped into one PR per
# ecosystem per week to avoid PR firehose; majors get individual PRs
# because of semver risk and intentional review burden.
#
# Cooldown: each ecosystem block carries a native Dependabot `cooldown:`
# (7 days for all bump types). This mirrors the 7-day floor enforced by
# the verify-lockfile CI job (supply-chain mitigation against same-day
# malicious uploads, e.g. Shai-Hulud-style worms). The cooldown gate is
# friendlier than the CI gate — Dependabot won't even *open* the PR
# until the cooldown passes, vs opening a PR that's guaranteed to fail
# CI for ~a week. See CONTRIBUTING.md "Releases" for the maintainer
# workflow.

version: 2

updates:

  # ---- Python dependencies ------------------------------------------------
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(py)"

  # ---- Production Dockerfile (base image digest) --------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(docker)"

  # ---- E2E harness compose stack (upstream echo + busybox init) ----------
  - package-ecosystem: docker
    directory: /tests/docker-e2e
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - dependencies
      - docker
      - tests
    commit-message:
      prefix: "deps(docker-e2e)"

  # ---- GitHub Actions (every uses: <action>@<sha> pin) -------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(actions)"
