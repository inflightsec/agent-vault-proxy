# Auto-discovered by the pre-commit docker hook and the CI osv-scan job.
#
# All ignored CVEs are in TRANSITIVE deps of mitmproxy (msgpack, h2, and
# cryptography's cert-verify / PKCS#7-decrypt paths), not in AVP's credential-
# injection path. They are suppressed only because the fix is not yet
# installable — never to silence an applicable, fixable issue.

# --- tornado: NO LONGER SUPPRESSED -------------------------------------------
# Seven tornado advisories used to live here, all "blocked by mitmproxy's
# tornado<=6.5.5 pin". That bound turned out to be conservative rather than a
# real incompatibility, so pyproject.toml now carries a
# `[tool.uv] override-dependencies = ["tornado>=6.5.8"]` and the lockfiles pull
# 6.5.8, which fixes every one of them. Nothing to ignore. If that override is
# ever removed, these come back and have to be re-triaged.

# --- msgpack: pinned by mitmproxy at msgpack<=1.1.2 --------------------------
[[IgnoredVulns]]
id = "GHSA-6v7p-g79w-8964"
# CVSS 7.5 OOB read in Unpacker reuse-after-error on untrusted input. Transitive
# via mitmproxy (flow serialization); AVP does not unpack untrusted msgpack. Fix
# (1.2.1) cannot be installed: mitmproxy 12.2.3 pins msgpack<=1.1.2. Drop when a
# mitmproxy release allows msgpack>=1.2.1.
reason = "msgpack OOB read, transitive via mitmproxy; fix (1.2.1) blocked by mitmproxy's msgpack<=1.1.2 pin"

# --- cryptography: pinned by mitmproxy at cryptography<=48.1,>=42.0 ----------
# AVP uses cryptography ONLY to load a PEM key + sign RS256/ES256 JWTs
# (injectors/jwt_bearer.py). All three CVEs are in code AVP never runs — X.509
# chain verification and PKCS#7 decryption. Fixes (49.0/50.0) can't install:
# every current mitmproxy release (12.1.2–12.2.3) pins cryptography<=48.1. Drop
# when a mitmproxy release allows cryptography>=50.0 and a regen pulls it.
[[IgnoredVulns]]
id = "PYSEC-2026-3552"
reason = "cryptography PKCS#7 EnvelopedData Bleichenbacher oracle; N/A (AVP never decrypts PKCS#7); fix (50.0) blocked by mitmproxy's cryptography<=48.1 pin"

[[IgnoredVulns]]
id = "PYSEC-2026-3553"
reason = "cryptography X.509 path-building DoS (duplicate self-signed intermediates); N/A (AVP never verifies cert chains); fix (49.0) blocked by mitmproxy's cryptography<=48.1 pin"

[[IgnoredVulns]]
id = "PYSEC-2026-3554"
reason = "cryptography X.509 name-constraint wildcard bypass; N/A (AVP never verifies cert chains); fix (49.0) blocked by mitmproxy's cryptography<=48.1 pin"

# --- h2: pinned by mitmproxy at h2==4.3.0 (EXACT) ---------------------------
# h2 is transitive via mitmproxy's HTTP/2 stack. mitmproxy 12.2.3 pins it
# exactly (Requires-Dist: h2<=4.3.0,>=4.3.0), so the 4.4.1 fix cannot be
# installed until a mitmproxy release relaxes the pin. The smuggling vector
# (CWE-444) needs an UNTRUSTED HTTP/2 client sending duplicate Host headers
# across an HTTP/2->HTTP/1.1 downgrade; AVP's client is the local trusted agent,
# not an internet peer. RADEK: confirm/refine this exposure note against
# architecture.md (request path) before committing. Drop when a mitmproxy
# release allows h2>=4.4.1 and a regen pulls it.
[[IgnoredVulns]]
id = "GHSA-6hr6-w5qg-qmwg"
reason = "h2 HTTP request smuggling (duplicate Host on HTTP/2->1.1 downgrade), CVSS 5.3, transitive via mitmproxy; needs an untrusted HTTP/2 client (AVP's client is the local trusted agent); fix (4.4.1) blocked by mitmproxy 12.2.3's exact h2==4.3.0 pin"
