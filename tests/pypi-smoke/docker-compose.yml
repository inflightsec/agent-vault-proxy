# Post-publish PyPI smoke test stack.
#
# Same shape as tests/docker-e2e/docker-compose.yml — proxy + upstream
# echo + init container — but the `avp` service is built from
# tests/pypi-smoke/Dockerfile which pip-installs the published wheel
# from PyPI rather than building from local source.
#
# Driven by tests/pypi-smoke/run.sh. The harness's PACKAGE_VERSION env
# is propagated into the build args via compose's parse-time
# interpolation; the same value is baked into the image at
# /etc/agent-vault-proxy-version for post-mortem diagnostics.

name: avp-pypi-smoke

services:

  # One-shot init: stages avp's /etc/agent-vault-proxy directory into a
  # named volume with avp-owned (UID 65532) files. Same approach as the
  # docker-e2e stack — generating secrets.yml in-container side-steps
  # Docker userns-remap UID-mapping issues that would otherwise prevent
  # the proxy from reading a host-mounted 0600 file.
  avp-init:
    image: busybox:1.36
    container_name: avp-pypi-smoke-init
    user: "0:0"
    volumes:
      - ./bindings.yaml:/src/bindings.yaml:ro
      - avp-pypi-smoke-config:/dst
    environment:
      # Empty-default rather than strict-require: compose interpolates
      # all referenced vars at parse time (including for `down`), so the
      # strict form blocked teardown when TEST_SECRET wasn't exported.
      # run.sh exports the real value before `compose up`; a manual
      # `compose up` without TEST_SECRET will fail the positive test at
      # run time (empty secret on the wire) rather than at compose time.
      - TEST_SECRET=${TEST_SECRET:-}
    command:
      - sh
      - -c
      - |
        set -eux
        ls -la /src/ /dst/
        id
        cp /src/bindings.yaml /dst/bindings.yaml
        cat > /dst/secrets.yml <<EOF
        secrets:
          TEST_API_KEY: "$TEST_SECRET"
        EOF
        chown 65532:65532 /dst/bindings.yaml /dst/secrets.yml
        chmod 0644 /dst/bindings.yaml
        chmod 0600 /dst/secrets.yml
        ls -la /dst/

  avp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # PACKAGE_VERSION is required; run.sh validates it's set before
        # invoking compose. PACKAGE_INDEX_URL defaults to PyPI inside
        # the Dockerfile but can be overridden for testing against
        # alternate indexes (e.g. a mirror). INSTALL_SOURCE=local makes
        # the build install from ./wheels/<name>.whl instead — the
        # dry-run path before tagging a release.
        PACKAGE_VERSION: ${PACKAGE_VERSION:?run.sh must export PACKAGE_VERSION}
        PACKAGE_INDEX_URL: ${PACKAGE_INDEX_URL:-https://pypi.org/simple/}
        INSTALL_SOURCE: ${INSTALL_SOURCE:-pypi}
    image: agent-vault-proxy:pypi-smoke
    container_name: avp-pypi-smoke
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - avp-pypi-smoke-net
    ports:
      # Loopback-only on the host side. Test client reaches the proxy
      # via 127.0.0.1:14323 without joining the bridge network.
      # Different host port from docker-e2e (14322) so both stacks can
      # run side-by-side without colliding.
      - "127.0.0.1:14323:14322"
    depends_on:
      avp-init:
        condition: service_completed_successfully
    volumes:
      - avp-pypi-smoke-config:/etc/agent-vault-proxy:ro
      - avp-pypi-smoke-state:/var/lib/agent-vault-proxy
      - avp-pypi-smoke-logs:/var/log/agent-vault-proxy
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 14322), timeout=2).close()"]
      interval: 2s
      timeout: 2s
      start_period: 15s
      retries: 10

  upstream:
    # Same echo image as docker-e2e. Tag-pinned for now; the comment in
    # docker-e2e/docker-compose.yml about resolving to a digest applies
    # here verbatim.
    image: mendhak/http-https-echo:36
    container_name: avp-pypi-smoke-upstream
    environment:
      - HTTP_PORT=8080
      - LOG_WITHOUT_NEWLINE=true
      - DISABLE_REQUEST_LOGS=true
    networks:
      avp-pypi-smoke-net:
        aliases:
          - upstream.test
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      start_period: 5s
      retries: 5

networks:
  avp-pypi-smoke-net:
    name: avp-pypi-smoke-net
    driver: bridge

volumes:
  avp-pypi-smoke-state:
    name: avp-pypi-smoke-state
  avp-pypi-smoke-logs:
    name: avp-pypi-smoke-logs
  avp-pypi-smoke-config:
    name: avp-pypi-smoke-config
