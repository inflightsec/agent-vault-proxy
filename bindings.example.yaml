version: 1

secrets:
  # Each entry: <SECRET_NAME>:placeholder + inject + bindings. The
  # `{<SECRET_NAME>}` slot in inject.format gets replaced with the real
  # value fetched from the backend just before the request goes upstream.
  # Default to the tightest scope (methods + paths) that's still useful —
  # every widening enlarges prompt-injection surface.

  ANTHROPIC_API_KEY:
    placeholder: "sk-ant-PLACEHOLDER-01HXY1234567890ABCDEFGH"
    inject:
      header: "Authorization"
      format: "Bearer {ANTHROPIC_API_KEY}"
    bindings:
      - host: "api.anthropic.com"
        methods: [POST]
        paths: ["/v1/messages", "/v1/messages/batches/**"]
      # MCP gateway: path scope omitted (paths defined upstream).
      - host: "mcp-proxy.anthropic.com"
        methods: [POST]
      # Claude Code CLI mixes GET (config) and POST (telemetry).
      - host: "*.claude.com"
        methods: [GET, POST]

  # api.github.com paths are REST-namespace-shaped. Narrow further if your
  # agent only browses one repo: paths: ["/repos/org/repo/**", "/user"].
  GITHUB_PAT:
    placeholder: "ghp_PLACEHOLDER_WORK_01HXY1234567890"
    inject:
      header: "Authorization"
      format: "token {GITHUB_PAT}"
    bindings:
      - host: "api.github.com"
        methods: [GET]
        paths: ["/repos/**", "/user", "/users/**", "/orgs/**", "/search/**"]
      - host: "uploads.github.com"
        methods: [POST, PUT]
        paths: ["/repos/**/releases/**"]

# Binding scope: `methods:` and `paths:` are optional. Empty list `[]`
# is rejected. `*` matches one path segment, `**` any number. Off-scope
# requests forward the placeholder verbatim and audit `binding_scope_violation`.

  OPENAI_API_KEY:
    placeholder: "sk-PLACEHOLDER-01HXY1234567890ABCDEFGHIJ"
    inject:
      header: "Authorization"
      format: "Bearer {OPENAI_API_KEY}"
    bindings:
      # Widen to /v1/files, /v1/fine_tuning/**, /v1/assistants/** as needed.
      - host: "api.openai.com"
        methods: [POST]
        paths: ["/v1/chat/completions", "/v1/embeddings", "/v1/responses"]

  GROQ_API_KEY:
    placeholder: "gsk_PLACEHOLDER_01HXY1234567890ABCDEF"
    inject:
      header: "Authorization"
      format: "Bearer {GROQ_API_KEY}"
    bindings:
      - host: "api.groq.com"
        methods: [POST]
        paths: ["/openai/v1/chat/completions", "/openai/v1/embeddings"]

  MISTRAL_API_KEY:
    placeholder: "mst_PLACEHOLDER_01HXY1234567890ABCDEF"
    inject:
      header: "Authorization"
      format: "Bearer {MISTRAL_API_KEY}"
    bindings:
      - host: "api.mistral.ai"
        methods: [POST]
        paths: ["/v1/chat/completions", "/v1/embeddings"]

  # DO admin tokens are broad by design. Scope by resource family if
  # possible; pair with an egress firewall for hard isolation.
  DO-API-TOKEN:
    placeholder: "dop_v1_PLACEHOLDER_01HXY1234567890ABC"
    inject:
      header: "Authorization"
      format: "Bearer {DO-API-TOKEN}"
    bindings:
      - host: "api.digitalocean.com"
        methods: [GET]
        paths: ["/v2/droplets/**", "/v2/account", "/v2/sizes", "/v2/regions"]

# Composite bindings (inject.template + compose): assemble multiple
# atomic secrets at fetch time via sandboxed Jinja2 (filters: b64encode,
# b64decode, sha256, urlencode; functions: hmac_sha256, hmac_sha512;
# 4-entry cap). See docs/architecture.md §4.2.

  # Multi-target binding: one placeholder, 2-4 leaf children (header /
  # body). No nesting, no compose, one body child max.
  WEBHOOK_DUAL:
    placeholder: "wh_PLACEHOLDER_01HXY1234567890ABCDEF"
    inject:
      type: multi
      injectors:
        - type: header
          header: "X-Webhook-Token"
          format: "{WEBHOOK_DUAL}"
        - type: body
          content_type: "application/json"
          format: "{WEBHOOK_DUAL}"
    bindings:
      - host: "webhook.example.com"
        methods: [POST]

  # ─── Body-injection bindings (inject.type: body) ──────────────────────
  # Some upstreams expect the credential in the request BODY, not a
  # header — Slack webhooks (token in JSON), HMAC-signed payloads with
  # the key embedded, OAuth code-exchange POST bodies. For these, set
  # `inject.type: body` and put the placeholder somewhere in the agent's
  # request body. The proxy substitutes it in place via STREAMING
  # replacement — body bytes never buffer in proxy memory regardless of
  # request size. Optional `content_type` filters to that media type
  # (parameters like `; charset=utf-8` are stripped before comparison);
  # omit to scan any content-type.
  SLACK_WEBHOOK_TOKEN:
    placeholder: "xoxb-PLACEHOLDER-01HXY1234567890ABCDEFGHIJ"
    inject:
      type: body
      content_type: "application/json"
      format: "{SLACK_WEBHOOK_TOKEN}"
    bindings:
      - host: "hooks.slack.com"
        methods: [POST]

  # Jira / Atlassian Cloud — Basic auth from email + API token, base64-encoded.
  # JIRA_EMAIL and JIRA_API_TOKEN are stored as separate BWS secrets and
  # composed at fetch time, so either can be rotated independently without
  # the other going silently stale. Replace `your-tenant.atlassian.net`
  # with your actual Atlassian Cloud hostname.
  JIRA_API_BASIC:
    placeholder: "jira_PLACEHOLDER_01HXY1234567890AB"
    inject:
      header: "Authorization"
      template: "Basic {{ (JIRA_EMAIL + ':' + JIRA_API_TOKEN) | b64encode }}"
    compose:
      - JIRA_EMAIL
      - JIRA_API_TOKEN
    bindings:
      - host: "your-tenant.atlassian.net"
        methods: [GET]
        paths: ["/rest/**"]

# ─── Composite body bindings (inject.type: body + inject.template) ────
# Body bindings can also use `inject.template + compose:` — same Jinja
# sandbox + helpers as composite headers (b64encode, sha256, urlencode,
# hmac_sha256/sha512/sha1, totp; arity-checked at config-load). Use these
# when a single secret value isn't enough — e.g. a 2FA code that must be
# computed from a base32 TOTP secret stored in BWS.
#
# Example: Kraken's private REST endpoints take the live 6-digit TOTP as
# the `otp` form field when the API key has 2FA enabled. The agent posts
# the placeholder in the `otp` slot; AVP renders the code from the
# BWS-held base32 secret and substitutes it in stream. `totp` is the only
# non-deterministic helper in the sandbox (depends on wall-clock time);
# render output rotates every 30s per RFC 6238.
#
# Operability for `totp`-using bindings:
#   * The AVP host clock must be in sync with the upstream's TOTP authority
#     to within the 30-second window. Verify `chronyc tracking` before
#     deploying — a drifted host produces codes the upstream silently refuses
#     and the agent sees only an upstream 4xx with no AVP-side audit clue.
#   * Agent retries that cross a 30-second boundary will substitute a NEW
#     code, not the original one. The audit log will show one
#     `body_binding_matched` event per request; correlating "one logical
#     login flow" needs request-id grouping on the agent side, not in AVP.

  KRAKEN_TOTP_BODY:
    placeholder: "kraken-totp_PLACEHOLDER_01HXY1234567890AB"
    inject:
      type: body
      content_type: "application/x-www-form-urlencoded"
      template: "{{ totp(KRAKEN_TOTP_SECRET) }}"
    compose:
      - KRAKEN_TOTP_SECRET
    bindings:
      - host: "api.kraken.com"
        methods: [POST]
        paths: ["/0/private/**"]

# Example opts into allow-list behavior. Set `forward_unmodified` to
# behave as a transparent forwarder for unrelated egress.
unmatched_destination_policy: deny

cache:
  ttl_seconds: 300
  max_entries: 100
  jitter_seconds: 30

audit:
  path: /var/log/agent-vault-proxy/audit.jsonl
  fail_on_unwritable: true

# Preflight warns on known-insecure deployment patterns (advisory by
# default). Uncomment to convert warnings into a startup abort:
# preflight:
#   fail_on_warning: true

# Backend: `type` is the discriminator. See docs/adapter-architecture.md
# for the protocol; planned backends include 1Password and HashiCorp Vault.
backend:
  type: bws
  config:
    type: bws
    organization_id: "REPLACE-WITH-YOUR-BWS-ORGANIZATION-UUID"
    access_token_path: /etc/agent-vault-proxy/bws-token
    state_path: /var/lib/agent-vault-proxy/bws-state.json

    # `BWS_ACCESS_TOKEN` env var, if set, ALWAYS wins over access_token_path.
    # Proxy emits a DeprecationWarning on first fetch when both are set.
    #
    # Region defaults: Bitwarden cloud, US (.com). For EU set
    #   api_url: https://api.bitwarden.eu
    #   identity_url: https://identity.bitwarden.eu
    # Self-hosted Bitwarden uses vault.example.com/{api,identity}; private-CA
    # trust setup in docs/prerequisites.md "Self-hosted Bitwarden".
    # Vaultwarden does NOT implement the BWS Secrets Manager API.
