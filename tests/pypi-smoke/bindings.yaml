version: 1

# PyPI smoke test: route the TEST_API_KEY placeholder through to the
# upstream echo container as a real Bearer token. The echo container
# responds with the request headers in its JSON body, which the test
# client parses to confirm the substitution actually happened on the
# wire — against a PyPI-installed kow, not a locally
# built one.
secrets:
  TEST_API_KEY:
    placeholder: "test-PLACEHOLDER-01HXY1234567890ABC"
    inject:
      header: "Authorization"
      format: "Bearer {TEST_API_KEY}"
    bindings:
      - host: "upstream.test"
        methods: [GET]
        paths: ["/"]

# Fail-closed for any host not listed above. The negative test exercises
# this by aiming a request at an unbound destination and asserting the
# proxy refuses + audits the deny.
unmatched_destination_policy: deny

cache:
  ttl_seconds: 60
  max_entries: 16
  jitter_seconds: 5

audit:
  path: /var/log/kow/audit.jsonl
  fail_on_unwritable: true

# Quiet preflight: documented happy path shouldn't log noise. Strict
# mode would fail the harness if any new preflight warning landed;
# advisory keeps the harness running across preflight additions until
# we explicitly decide to tighten it.
preflight:
  fail_on_warning: false

backend:
  type: static
  config:
    type: static
    path: /etc/kow/secrets.yml
