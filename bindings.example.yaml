version: 1

# Wildcard binding hosts (`*.suffix`) are OFF by default — a wildcard widens a
# secret's blast radius to every subdomain, so it must be a deliberate opt-in.
# This example uses `*.claude.com` below, so it sets the flag. Remove this line
# (and switch to exact hosts) for the tightest posture. Public-suffix wildcards
# like `*.com` / `*.co.uk` are rejected even with this enabled.
allow_wildcard_hosts: true

# Notes host allowlist (ADR-0024) — OPT-IN, off by default (commented out).
# Only relevant with `binding_source: notes`/`both`. When set, a host named in
# a BWS note or GSM `avp-binding` annotation must appear here (exact, or a
# `*.suffix` entry under allow_wildcard_hosts) or that binding is dropped
# fail-closed and audited `host_not_in_allowlist`. Annotations can then only
# NARROW scope (methods/paths within an allowed host), never ADD a host —
# closing the GCP confused-deputy where a principal who can edit annotations
# but not read the secret could route it to a host they control. File
# `secrets:` bindings below are the trusted tier and exempt. Leave commented
# to keep the zero-config notes flow unchanged.
# notes_host_allowlist:
#   - api.anthropic.com
#   - api.openai.com

secrets:
  # Each entry: <SECRET_NAME>:placeholder + inject + bindings. The
  # `{<SECRET_NAME>}` slot in inject.format gets replaced with the real
  # value fetched from the backend just before the request goes upstream.
  # Default to the tightest scope (methods + paths) that's still useful —
  # every widening enlarges prompt-injection surface.

  ANTHROPIC_API_KEY:
    placeholder: "sk-ant-PLACEHOLDER-01HXY1234567890ABCDEFGH"
    inject:
      header: "Authorization"
      format: "Bearer {ANTHROPIC_API_KEY}"
    bindings:
      - host: "api.anthropic.com"
        methods: [POST]
        paths: ["/v1/messages", "/v1/messages/batches/**"]
      # MCP gateway: path scope omitted (paths defined upstream).
      - host: "mcp-proxy.anthropic.com"
        methods: [POST]
      # Claude Code CLI mixes GET (config) and POST (telemetry).
      - host: "*.claude.com"
        methods: [GET, POST]

  # api.github.com paths are REST-namespace-shaped. Narrow further if your
  # agent only browses one repo: paths: ["/repos/org/repo/**", "/user"].
  GITHUB_PAT:
    placeholder: "ghp_PLACEHOLDER_WORK_01HXY1234567890"
    inject:
      header: "Authorization"
      format: "token {GITHUB_PAT}"
    bindings:
      - host: "api.github.com"
        methods: [GET]
        paths: ["/repos/**", "/user", "/users/**", "/orgs/**", "/search/**"]
      - host: "uploads.github.com"
        methods: [POST, PUT]
        paths: ["/repos/**/releases/**"]

# Binding scope: `methods:` and `paths:` are optional. Empty list `[]`
# is rejected. `*` matches one path segment, `**` any number. Off-scope
# requests forward the placeholder verbatim and audit `binding_scope_violation`.

  OPENAI_API_KEY:
    placeholder: "sk-PLACEHOLDER-01HXY1234567890ABCDEFGHIJ"
    inject:
      header: "Authorization"
      format: "Bearer {OPENAI_API_KEY}"
    bindings:
      # Widen to /v1/files, /v1/fine_tuning/**, /v1/assistants/** as needed.
      - host: "api.openai.com"
        methods: [POST]
        paths: ["/v1/chat/completions", "/v1/embeddings", "/v1/responses"]

  GROQ_API_KEY:
    placeholder: "gsk_PLACEHOLDER_01HXY1234567890ABCDEF"
    inject:
      header: "Authorization"
      format: "Bearer {GROQ_API_KEY}"
    bindings:
      - host: "api.groq.com"
        methods: [POST]
        paths: ["/openai/v1/chat/completions", "/openai/v1/embeddings"]

  MISTRAL_API_KEY:
    placeholder: "mst_PLACEHOLDER_01HXY1234567890ABCDEF"
    inject:
      header: "Authorization"
      format: "Bearer {MISTRAL_API_KEY}"
    bindings:
      - host: "api.mistral.ai"
        methods: [POST]
        paths: ["/v1/chat/completions", "/v1/embeddings"]

  # DO admin tokens are broad by design. Scope by resource family if
  # possible; pair with an egress firewall for hard isolation.
  DO-API-TOKEN:
    placeholder: "dop_v1_PLACEHOLDER_01HXY1234567890ABC"
    inject:
      header: "Authorization"
      format: "Bearer {DO-API-TOKEN}"
    bindings:
      - host: "api.digitalocean.com"
        methods: [GET]
        paths: ["/v2/droplets/**", "/v2/account", "/v2/sizes", "/v2/regions"]

# Composite bindings (inject.template + compose): assemble multiple
# atomic secrets at fetch time via sandboxed Jinja2 (filters: b64encode,
# b64decode, sha256, urlencode; functions: hmac_sha256, hmac_sha512;
# 4-entry cap). See docs/architecture.md §4.2.

  # Multi-target binding: one placeholder, 2-4 leaf children (header /
  # body). No nesting, no compose, one body child max.
  WEBHOOK_DUAL:
    placeholder: "wh_PLACEHOLDER_01HXY1234567890ABCDEF"
    inject:
      type: multi
      injectors:
        - type: header
          header: "X-Webhook-Token"
          format: "{WEBHOOK_DUAL}"
        - type: body
          content_type: "application/json"
          format: "{WEBHOOK_DUAL}"
    bindings:
      - host: "webhook.example.com"
        methods: [POST]

  # ─── Body-injection bindings (inject.type: body) ──────────────────────
  # Some upstreams expect the credential in the request BODY, not a
  # header — Slack webhooks (token in JSON), HMAC-signed payloads with
  # the key embedded, OAuth code-exchange POST bodies. For these, set
  # `inject.type: body` and put the placeholder somewhere in the agent's
  # request body. The proxy substitutes it in place via STREAMING
  # replacement — body bytes never buffer in proxy memory regardless of
  # request size. Optional `content_type` filters to that media type
  # (parameters like `; charset=utf-8` are stripped before comparison);
  # omit to scan any content-type.
  SLACK_WEBHOOK_TOKEN:
    placeholder: "xoxb-PLACEHOLDER-01HXY1234567890ABCDEFGHIJ"
    inject:
      type: body
      content_type: "application/json"
      format: "{SLACK_WEBHOOK_TOKEN}"
    bindings:
      - host: "hooks.slack.com"
        methods: [POST]

  # Jira / Atlassian Cloud — Basic auth from email + API token, base64-encoded.
  # JIRA_EMAIL and JIRA_API_TOKEN are stored as separate BWS secrets and
  # composed at fetch time, so either can be rotated independently without
  # the other going silently stale. Replace `your-tenant.atlassian.net`
  # with your actual Atlassian Cloud hostname.
  JIRA_API_BASIC:
    placeholder: "jira_PLACEHOLDER_01HXY1234567890AB"
    inject:
      header: "Authorization"
      template: "Basic {{ (JIRA_EMAIL + ':' + JIRA_API_TOKEN) | b64encode }}"
    compose:
      - JIRA_EMAIL
      - JIRA_API_TOKEN
    bindings:
      - host: "your-tenant.atlassian.net"
        methods: [GET]
        paths: ["/rest/**"]

# ─── Composite body bindings (inject.type: body + inject.template) ────
# Body bindings can also use `inject.template + compose:` — same Jinja
# sandbox + helpers as composite headers (b64encode, sha256, urlencode,
# hmac_sha256/sha512/sha1, totp; arity-checked at config-load). Use these
# when a single secret value isn't enough — e.g. a 2FA code that must be
# computed from a base32 TOTP secret stored in BWS.
#
# Example: Kraken's private REST endpoints take the live 6-digit TOTP as
# the `otp` form field when the API key has 2FA enabled. The agent posts
# the placeholder in the `otp` slot; AVP renders the code from the
# BWS-held base32 secret and substitutes it in stream. `totp` is the only
# non-deterministic helper in the sandbox (depends on wall-clock time);
# render output rotates every 30s per RFC 6238.
#
# Operability for `totp`-using bindings:
#   * The AVP host clock must be in sync with the upstream's TOTP authority
#     to within the 30-second window. Verify `chronyc tracking` before
#     deploying — a drifted host produces codes the upstream silently refuses
#     and the agent sees only an upstream 4xx with no AVP-side audit clue.
#   * Agent retries that cross a 30-second boundary will substitute a NEW
#     code, not the original one. The audit log will show one
#     `body_binding_matched` event per request; correlating "one logical
#     login flow" needs request-id grouping on the agent side, not in AVP.

  KRAKEN_TOTP_BODY:
    placeholder: "kraken-totp_PLACEHOLDER_01HXY1234567890AB"
    inject:
      type: body
      content_type: "application/x-www-form-urlencoded"
      template: "{{ totp(KRAKEN_TOTP_SECRET) }}"
    compose:
      - KRAKEN_TOTP_SECRET
    bindings:
      - host: "api.kraken.com"
        methods: [POST]
        paths: ["/0/private/**"]

  # ─── OAuth2 refresh-token grant (inject.type: oauth2_refresh) ────────
  # For upstreams that issue short-lived access tokens against a refresh
  # token: GCP, Microsoft Graph, Slack admin, Atlassian Cloud, Auth0 /
  # Okta tenants, etc. AVP holds the three durable inputs (client_id,
  # client_secret, refresh_token) in the vault and exchanges them on
  # demand for an access token that gets injected into the agent's
  # outgoing request. The agent NEVER sees the refresh token.
  #
  # Provider presets pin the token_url + client_auth_method + rotation
  # disposition per vendor (catalogue lives in
  # ``agent_vault_proxy/oauth_providers.py``); operator picks one of
  # ``provider:`` OR supplies ``token_url:`` + ``client_auth_method:``
  # explicitly. Tenant-specific providers (auth0, okta) take ``provider:``
  # AND ``token_url:`` together — the preset pins auth method + rotation
  # semantics, the operator supplies the tenant URL.
  #
  # ``refresh_token_write_back: true`` (default) persists rotated
  # refresh tokens back to the vault so subsequent exchanges find the
  # new value. Read-only backends (``static``) cannot write-back —
  # ``avp doctor --probe-oauth`` flags this; either move to a writable
  # backend or explicitly opt-out with ``refresh_token_write_back:
  # false`` (accepting that the binding will lock out on the next
  # upstream rotation).
  #
  # ``write_back_min_interval_seconds`` (default 60; 0 disables) floors
  # the gap between write-back PUTs per binding, so a hostile or broken
  # upstream forcing a rotation on every exchange cannot storm the
  # vault. Excess rotations audit ``write_back_rate_limited`` and are
  # not persisted.
  #
  # ``avp doctor --probe-oauth --binding GOOGLE_OAUTH`` validates SSRF,
  # vault inputs, and write-back capability without making a proxied
  # request. Add ``--exchange`` to also call the token endpoint live
  # (state-mutating against the upstream — most providers rotate).
  #
  # ⚠ REQUIRES A WRITABLE BACKEND. Google rotates the refresh token on
  # every exchange. With ``backend.type: static`` (read-only), this
  # binding will self-destruct on the FIRST proxied request — the
  # upstream issues a new refresh token, AVP can't write it back to the
  # vault, the next exchange uses the stale value and gets
  # ``invalid_grant`` forever. Use ``backend.type: bws`` (writable) or
  # explicitly set ``refresh_token_write_back: false`` and accept the
  # lockout. ``avp doctor --probe-oauth`` will FAIL on a read-only
  # backend with write-back enabled — heed it.
  GOOGLE_OAUTH:
    placeholder: "google-oauth-PLACEHOLDER-01HXY1234567890ABCD"
    inject:
      type: oauth2_refresh
      provider: google
      client_id_secret: GOOGLE_OAUTH_CLIENT_ID
      client_secret_secret: GOOGLE_OAUTH_CLIENT_SECRET
      refresh_token_secret: GOOGLE_OAUTH_REFRESH_TOKEN
      # Optional overrides:
      # header: "Authorization"             # default
      # access_token_format: "Bearer {access_token}"  # default
      # scopes: ["https://www.googleapis.com/auth/drive.readonly"]
      # cache_ttl_safety_seconds: 60        # default
      # cache_ttl_max_seconds: 3600         # default
      # refresh_token_write_back: true      # default
    bindings:
      - host: "www.googleapis.com"
        methods: [GET, POST]

  # ─── AWS SigV4 request signing (inject.type: sigv4) — ADR-0027 ───────────
  # AWS APIs don't take a static bearer credential; each request is signed
  # (AWS4-HMAC-SHA256 over method + canonical URI/query + signed headers +
  # SHA-256 of the body). AVP holds the access key id + secret access key in the
  # vault and signs in-stream, so the agent never holds AWS credentials. The
  # secret's `placeholder`, planted in Authorization, is only the DETECTION
  # trigger — nothing is substituted, the signature is computed. For STS/temporary
  # credentials add `session_token_secret`. A sigv4 + body-injector on one host is
  # rejected at config-load (SigV4 already hashes the whole body).
  AWS_S3:
    placeholder: "aws-sigv4-PLACEHOLDER-01HXY1234567890ABCD"
    inject:
      type: sigv4
      region: us-east-1
      service: s3
      access_key_id_secret: AWS_ACCESS_KEY_ID
      secret_access_key_secret: AWS_SECRET_ACCESS_KEY
      # session_token_secret: AWS_SESSION_TOKEN   # STS / temporary credentials
    bindings:
      - host: "s3.us-east-1.amazonaws.com"
        methods: [GET, PUT]

  # ─── Generic HMAC request signing (inject.type: hmac) — ADR-0028 ─────────
  # For upstreams that authenticate a request by an HMAC over request parts.
  # The operator declares the exact `signing_string` (tokens: {method} {path}
  # {query} {host} {body_sha256} {timestamp}); AVP signs it with the vault-held
  # key and writes the hex/base64 digest to `header`. `timestamp_header` (opt.)
  # echoes the {timestamp} so the server can bound request age. A {body_sha256}
  # template signs in the request hook (needs the buffered body).
  WEBHOOK_HMAC:
    placeholder: "hmac-PLACEHOLDER-01HXY1234567890ABCDEF"
    inject:
      type: hmac
      secret_key_secret: WEBHOOK_SIGNING_KEY
      signing_string: "{method}\n{path}\n{body_sha256}\n{timestamp}"
      header: "X-Signature"
      algorithm: sha256          # sha1 | sha256 | sha384 | sha512
      encoding: hex              # hex | base64
      timestamp_header: "X-Timestamp"
    bindings:
      - host: "api.hmac-example.com"
        methods: [POST]

  # ─── JWT bearer assertion (inject.type: jwt_bearer) — ADR-0028 ───────────
  # Mints a signed JWT from operator-declared claims and injects it as a bearer
  # credential (default `Authorization: Bearer <jwt>`). HS256 uses a shared
  # secret; RS256/ES256 a PEM private key — all held in the vault. iat/exp are
  # stamped from `ttl_seconds` at request time. This INJECTS the JWT directly;
  # for the RFC 7523 grant (sign a JWT then EXCHANGE it for an access token,
  # e.g. Google service accounts) see the roadmap.
  API_JWT:
    placeholder: "jwt-PLACEHOLDER-01HXY1234567890ABCDEF"
    inject:
      type: jwt_bearer
      signing_key_secret: JWT_SIGNING_KEY      # HMAC secret (HS256) or PEM key (RS/ES256)
      algorithm: RS256                         # HS256 | RS256 | ES256
      issuer: "my-service"
      subject: "my-service"
      audience: "https://api.jwt-example.com"
      ttl_seconds: 300
      # header: "Authorization"                # default
      # format: "Bearer {jwt}"                 # default; must contain {jwt}
      # extra_claims: {scope: "read:data"}
    bindings:
      - host: "api.jwt-example.com"
        methods: [GET, POST]

  # ─── OAuth2 client-credentials grant (inject.type: oauth2_client_credentials)
  # ─── ADR-0029. Machine-to-machine sibling of oauth2_refresh: exchanges a
  # vault client id + secret for a short-lived access token at `token_url`
  # (which MUST be https), caches it per-binding, injects `Bearer {access_token}`.
  # `client_auth_method`: body_post (id+secret in the form body) or basic (HTTP
  # Basic). No refresh token, no rotation.
  API_OAUTH_CC:
    placeholder: "oauth-cc-PLACEHOLDER-01HXY1234567890AB"
    inject:
      type: oauth2_client_credentials
      token_url: "https://login.cc-example.com/oauth2/token"
      client_auth_method: body_post            # body_post | basic
      client_id_secret: OAUTH_CLIENT_ID
      client_secret_secret: OAUTH_CLIENT_SECRET
      scopes: "read:data write:data"
      # header: "Authorization"                # default
      # format: "Bearer {access_token}"        # default
    bindings:
      - host: "api.cc-example.com"
        methods: [GET, POST]

  # ─── GitHub App installation token (inject.type: github_app) — ADR-0030 ──
  # Mints an App JWT (RS256) from the App's PEM private key, exchanges it at
  # /app/installations/{installation_id}/access_tokens for a short-lived
  # installation token, caches it, and injects `Authorization: token <token>`.
  # Set `api_base_url` for GitHub Enterprise Server. The App private key never
  # leaves the vault; the minted token never reaches the audit log.
  GITHUB_APP:
    placeholder: "github-app-PLACEHOLDER-01HXY1234567890"
    inject:
      type: github_app
      app_id: "123456"
      installation_id: "78901234"
      private_key_secret: GITHUB_APP_PRIVATE_KEY   # PEM RSA private key
      # api_base_url: "https://api.github.com"     # default; set for GHES
      # format: "token {token}"                    # default; must contain {token}
    bindings:
      - host: "api.github.com"
        methods: [GET, POST]
        paths: ["/repos/**", "/installation/**"]

  # ─── Honeytoken (canary) binding — ADR-0019 §5 ───────────────────────────
  # A trap credential. `honeytoken: true` makes ANY use of this placeholder
  # emit a `honeytoken_triggered` audit event (in addition to the normal
  # decision) — injected, denied, scope-violated, or aimed at the wrong host.
  # Plant the placeholder somewhere tempting (a decoy `.env`, a fake
  # `~/.aws/credentials`) and bind it to a trap host you control. The agent
  # never holds the real value, so the tripwire fires on INTENT, before any
  # secret moves. Shipped off-box, one trigger anywhere = a walked machine.
  DECOY_AWS_PROD:
    placeholder: "AKIA-PLACEHOLDER-DECOY-01HXY1234567890"
    honeytoken: true
    inject:
      header: "Authorization"
      format: "{DECOY_AWS_PROD}"
    bindings:
      - host: "canary.your-domain.example"

# Example opts into allow-list behavior. Set `forward_unmodified` to
# behave as a transparent forwarder for unrelated egress.
unmatched_destination_policy: deny

# ADR-0026: which destinations AVP TLS-terminates (MITM). `bound` (default):
# terminate + inject ONLY bound hosts; every other CONNECT is an opaque
# passthrough (no decryption — AVP never holds plaintext it won't broker), and
# a `tls_passthrough` audit event records the tunneled host. `all`: terminate
# everything (max observability; the pre-ADR-0026 behaviour).
tls_termination: bound

cache:
  ttl_seconds: 300
  max_entries: 100
  jitter_seconds: 30

audit:
  path: /var/log/agent-vault-proxy/audit.jsonl
  fail_on_unwritable: true

# Preflight warns on known-insecure deployment patterns (advisory by
# default). Uncomment to convert warnings into a startup abort:
# preflight:
#   fail_on_warning: true

# Backend: `type` is the discriminator. See docs/adapter-architecture.md
# for the protocol; planned backends include 1Password and HashiCorp Vault.
backend:
  type: bws
  config:
    type: bws
    organization_id: "REPLACE-WITH-YOUR-BWS-ORGANIZATION-UUID"
    access_token_path: /etc/agent-vault-proxy/bws-token
    state_path: /var/lib/agent-vault-proxy/bws-state.json

    # `BWS_ACCESS_TOKEN` env var, if set, ALWAYS wins over access_token_path.
    # Proxy emits a DeprecationWarning on first fetch when both are set.
    #
    # Region defaults: Bitwarden cloud, US (.com). For EU set
    #   api_url: https://api.bitwarden.eu
    #   identity_url: https://identity.bitwarden.eu
    # Self-hosted Bitwarden uses vault.example.com/{api,identity}; private-CA
    # trust setup in docs/prerequisites.md "Self-hosted Bitwarden".
    # Vaultwarden does NOT implement the BWS Secrets Manager API.

# ─── Alternative backend: Google Secret Manager (type: gsm) ──────────────────
# Keyless by design — there is NO key-file field. Authenticate with ADC +
# service-account impersonation, or a Workload-Identity cred-config. With
# `binding_source: notes`, each GSM secret is host-bound by its own
# `avp-binding` annotation — first line the exact marker `# avp-binding`
# (ADR-0025; an unmarked note is a description, not a binding), then a bare
# host or flat-YAML — so no `secrets:` block is needed.
# See docs/adapter-architecture.md + docs/adrs/ADR-0018 + ADR-0025.
# binding_source: notes
# backend:
#   type: gsm
#   config:
#     type: gsm
#     project_id: "123456789012"             # project NUMBER preferred
#     secret_prefix: "avp-owner-"            # scopes list + the self_check guard
#     impersonate_service_account: "avp-ro@PROJECT.iam.gserviceaccount.com"
#     # credential_config_path: /etc/agent-vault-proxy/gcp-wif.json   # WIF instead
#     self_check: deny                        # refuse to start under a broad identity
#     reject_ambient_key: true                # refuse a downloaded SA key via ADC
