# End-to-end Docker integration harness for agent-vault-proxy.
#
# Stands up two containers on an isolated bridge network:
#   - avp:      the agent-vault-proxy image built from the repo Dockerfile
#   - upstream: an HTTP echo server that mirrors received headers back
#
# Drives a positive test (placeholder → real secret on the wire) and a
# negative test (deny on unmatched destination) from the host side via
# the `run.sh` script. See README.md for the test design.
#
# Project name is overridden by run.sh to avoid colliding with any
# other compose stack the operator may have running.

name: avp-e2e

services:

  # One-shot init: stages the avp service's /etc/agent-vault-proxy/
  # directory into a named volume with avp-owned (UID 65532) files.
  #
  # bindings.yaml is bind-mounted read-only (committed in the repo, no
  # secret content). secrets.yml is GENERATED in-place from the
  # TEST_SECRET env var rather than bind-mounted — on a Docker daemon
  # with userns-remap enabled, container "root" maps to a non-root host
  # UID and CANNOT read a host 0600 file owned by a different UID. The
  # bind-mounted approach worked on plain Docker but failed silently
  # against a hardened daemon (discovered 2026-05-30 via the e2e
  # diagnostic dump). Generating the file inside the container side-
  # steps the host-UID mismatch entirely. The literal secret value is
  # passed via compose's parse-time env interpolation so run.sh stays
  # the single source of truth.
  avp-init:
    image: busybox:1.36
    container_name: avp-e2e-init
    user: "0:0"
    volumes:
      - ./bindings.yaml:/src/bindings.yaml:ro
      - avp-e2e-config:/dst
    environment:
      - TEST_SECRET=${TEST_SECRET:?run.sh must export TEST_SECRET before compose up}
      - TEST_BODY_SECRET=${TEST_BODY_SECRET:?run.sh must export TEST_BODY_SECRET before compose up}
      - TEST_MULTI_SECRET=${TEST_MULTI_SECRET:?run.sh must export TEST_MULTI_SECRET before compose up}
    command:
      - sh
      - -c
      - |
        set -eux
        ls -la /src/ /dst/
        id
        cp /src/bindings.yaml /dst/bindings.yaml
        # Heredoc keeps the on-disk file off the host filesystem and
        # avoids quoting pitfalls inside the YAML command block.
        cat > /dst/secrets.yml <<EOF
        secrets:
          TEST_API_KEY: "$TEST_SECRET"
          TEST_BODY_KEY: "$TEST_BODY_SECRET"
          TEST_MULTI_KEY: "$TEST_MULTI_SECRET"
          E2E_USER: "e2e-user"
          E2E_PASS: "e2e-pass-value"
          OAUTH_CLIENT_ID: "mock-client-id"
          OAUTH_CLIENT_SECRET: "mock-client-secret"
          OAUTH_REFRESH_TOKEN: "mock-refresh-token-original"
        EOF
        # NOTE: FAILCLOSED_KEY is intentionally NOT written here — the
        # fail-closed test binds it but leaves its secret unresolvable.
        chown 65532:65532 /dst/bindings.yaml /dst/secrets.yml
        chmod 0644 /dst/bindings.yaml
        chmod 0600 /dst/secrets.yml
        ls -la /dst/

  avp:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: agent-vault-proxy:e2e
    container_name: avp-e2e
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - avp-e2e-net
      # Second network on a PUBLIC subnet so token.mock resolves to a
      # non-private IP that passes the oauth SSRF guard at config-load.
      - avp-oauth-net
    environment:
      # The oauth token-exchange (urllib -> ssl.create_default_context()) trusts
      # the mock's TLS via the DEBIAN SYSTEM CA BUNDLE, not SSL_CERT_FILE (which
      # create_default_context ignores on Debian — confirmed by a 2026-07-02
      # run showing CERTIFICATE_VERIFY_FAILED with SSL_CERT_FILE set). So the
      # self-signed cert is bind-mounted OVER /etc/ssl/certs/ca-certificates.crt
      # below (works even with read_only: true). SSL_CERT_FILE is kept pointing
      # at the same path as belt-and-suspenders.
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    ports:
      # Loopback-only on the host side. The harness publishes 14322 so
      # the test client can reach the proxy without joining the network.
      - "127.0.0.1:14322:14322"
    depends_on:
      avp-init:
        condition: service_completed_successfully
      token-mock:
        condition: service_healthy
    volumes:
      # Mount the avp-init-populated volume read-only. The volume holds
      # avp-owned (UID 65532) copies of the host config files at the
      # correct modes, so the static backend's world-readable check passes
      # AND the avp process can actually read them.
      - avp-e2e-config:/etc/agent-vault-proxy:ro
      - avp-e2e-state:/var/lib/agent-vault-proxy
      - avp-e2e-logs:/var/log/agent-vault-proxy
      # Self-signed CA for token.mock (generated by run.sh), bind-mounted OVER
      # the Debian system CA bundle so ssl.create_default_context() trusts it.
      # Only the oauth token-exchange makes an outbound TLS call (upstream is
      # plain HTTP; static backend), so replacing the bundle is safe here.
      - ${OAUTH_CERT_DIR:?run.sh must export OAUTH_CERT_DIR}/server.crt:/etc/ssl/certs/ca-certificates.crt:ro
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 14322), timeout=2).close()"]
      interval: 2s
      timeout: 2s
      start_period: 10s
      retries: 5

  # Hermetic mock OAuth2 token endpoint. Serves HTTPS on :8443 and returns a
  # fixed access_token + expires_in + a ROTATED refresh_token on POST /token,
  # so the harness can assert the minted Bearer reaches the upstream, the
  # token_exchange audit fires, and rotation triggers refresh_token_rotated.
  # Sits on avp-oauth-net at a fixed PUBLIC-range IP (8.8.8.10) aliased
  # token.mock so it passes the SSRF guard. Cert generated by run.sh.
  # TODO(operator): pin python:3.12-slim to a digest before CI.
  token-mock:
    image: python:3.12-slim
    container_name: avp-e2e-token-mock
    volumes:
      - ${OAUTH_CERT_DIR:?run.sh must export OAUTH_CERT_DIR}:/certs:ro
    command:
      - python
      - -c
      - |
        import http.server, ssl, json
        TOKEN = {"access_token": "MOCK-ACCESS-TOKEN-abc123",
                 "token_type": "Bearer", "expires_in": 3600,
                 "refresh_token": "ROTATED-REFRESH-TOKEN-xyz789"}
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                n = int(self.headers.get("Content-Length", 0) or 0)
                self.rfile.read(n)
                body = json.dumps(TOKEN).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        ctx.load_cert_chain("/certs/server.crt", "/certs/server.key")
        srv = http.server.HTTPServer(("0.0.0.0", 8443), H)
        srv.socket = ctx.wrap_socket(srv.socket, server_side=True)
        srv.serve_forever()
    networks:
      avp-oauth-net:
        ipv4_address: 8.8.8.10
        aliases:
          - token.mock
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8443), timeout=2).close()"]
      interval: 2s
      timeout: 2s
      start_period: 5s
      retries: 5

  upstream:
    # TODO(operator): before this lands in CI, pin to a digest:
    #   docker pull mendhak/http-https-echo:36 && \
    #   docker image inspect mendhak/http-https-echo:36 \
    #     --format '{{index .RepoDigests 0}}'
    # then replace the `:36` tag below with `@sha256:...`. Tag pinning is
    # acceptable for local-dev runs while the digest is being resolved.
    image: mendhak/http-https-echo:36
    container_name: avp-e2e-upstream
    environment:
      - HTTP_PORT=8080
      - LOG_WITHOUT_NEWLINE=true
      - DISABLE_REQUEST_LOGS=true
    networks:
      avp-e2e-net:
        # Static alias so the binding host in bindings.yaml is stable.
        aliases:
          - upstream.test
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      start_period: 5s
      retries: 5

networks:
  avp-e2e-net:
    name: avp-e2e-net
    driver: bridge
  # Isolated bridge on a PUBLIC-range subnet. The mock token endpoint gets a
  # non-private IP (8.8.8.10) so the oauth SSRF guard — which rejects RFC1918 /
  # loopback / CGNAT / reserved by design — permits the token_url. The subnet
  # is namespaced to this bridge; the host and real 8.8.8.0/24 are unaffected.
  avp-oauth-net:
    name: avp-oauth-net
    driver: bridge
    ipam:
      config:
        - subnet: 8.8.8.0/24

volumes:
  avp-e2e-state:
    name: avp-e2e-state
  avp-e2e-logs:
    name: avp-e2e-logs
  avp-e2e-config:
    name: avp-e2e-config
