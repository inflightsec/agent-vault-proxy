version: 1

# E2E harness: route the TEST_API_KEY placeholder through to the
# upstream echo container as a real Bearer token. The echo container
# responds with the request headers in its JSON body, which the test
# client parses to confirm the substitution actually happened on the
# wire.
secrets:
  TEST_API_KEY:
    placeholder: "test-PLACEHOLDER-01HXY1234567890ABC"
    inject:
      header: "Authorization"
      format: "Bearer {TEST_API_KEY}"
    bindings:
      - host: "upstream.test"
        methods: [GET]
        paths: ["/"]

  # v0.5 body injector: placeholder lives in the JSON request body, not
  # a header. Scoped to /body so it can't collide with the header path.
  TEST_BODY_KEY:
    placeholder: "body-PLACEHOLDER-01HXY1234567890BDY"
    inject:
      type: body
      content_type: "application/json"
      format: "{TEST_BODY_KEY}"
    bindings:
      - host: "upstream.test"
        methods: [POST]
        paths: ["/body"]

  # v0.5 multi injector: same placeholder substituted in TWO places on
  # one request — a custom header AND the JSON body. Scoped to /multi.
  TEST_MULTI_KEY:
    placeholder: "multi-PLACEHOLDER-01HXY1234567890MLT"
    inject:
      type: multi
      injectors:
        - type: header
          header: "X-Multi-Key"
          format: "{TEST_MULTI_KEY}"
        - type: body
          content_type: "application/json"
          format: "{TEST_MULTI_KEY}"
    bindings:
      - host: "upstream.test"
        methods: [POST]
        paths: ["/multi"]

  # Composite HEADER: two atomic secrets assembled at fetch time via the
  # sandboxed Jinja template (b64encode helper). Proves inject.template +
  # compose lands the rendered Basic credential on the wire. Scoped to
  # /composite-header so it can't collide with other paths.
  COMPOSITE_HEADER:
    placeholder: "cphdr-PLACEHOLDER-01HXY1234567890CH"
    inject:
      header: "Authorization"
      template: "Basic {{ (E2E_USER + ':' + E2E_PASS) | b64encode }}"
    compose:
      - E2E_USER
      - E2E_PASS
    bindings:
      - host: "upstream.test"
        methods: [GET]
        paths: ["/composite-header"]

  # Composite BODY: same compose machinery, but the rendered value is
  # substituted into the JSON request body instead of a header. Scoped to
  # /composite-body.
  COMPOSITE_BODY:
    placeholder: "cpbody-PLACEHOLDER-01HXY1234567890CB"
    inject:
      type: body
      content_type: "application/json"
      template: "{{ (E2E_USER + ':' + E2E_PASS) | b64encode }}"
    compose:
      - E2E_USER
      - E2E_PASS
    bindings:
      - host: "upstream.test"
        methods: [POST]
        paths: ["/composite-body"]

  # Fail-closed: bound, but its secret is deliberately ABSENT from the static
  # secrets file. A request carrying it matches the binding, but the fetch
  # fails -> AVP returns 503 (emit_denial_and_503), the request never reaches
  # the upstream, and the failure is audited. Preflight does NOT resolve
  # secrets, so a missing one does not break boot. Scoped to /failclosed.
  FAILCLOSED_KEY:
    placeholder: "failclosed-PLACEHOLDER-01HXY1234567FC"
    inject:
      header: "Authorization"
      format: "Bearer {FAILCLOSED_KEY}"
    bindings:
      - host: "upstream.test"
        methods: [GET]
        paths: ["/failclosed"]

  # oauth2_refresh (v0.7): the agent sends this placeholder; AVP exchanges the
  # refresh token at the mock token endpoint for a short-lived access token and
  # injects it as a Bearer. token_url points at the hermetic mock container,
  # which resolves (docker DNS) to a PUBLIC-range IP so it passes the SSRF guard
  # — a private/bridge IP is rejected at config-load by design. The mock serves
  # HTTPS with a cert the avp container trusts via SSL_CERT_FILE (compose).
  OAUTH_TEST:
    placeholder: "oauth-PLACEHOLDER-01HXY1234567890OATH"
    inject:
      type: oauth2_refresh
      token_url: "https://token.mock:8443/token"
      client_auth_method: "body_post"
      client_id_secret: OAUTH_CLIENT_ID
      client_secret_secret: OAUTH_CLIENT_SECRET
      refresh_token_secret: OAUTH_REFRESH_TOKEN
    bindings:
      - host: "upstream.test"
        methods: [GET]
        paths: ["/oauth"]

# Fail-closed for any host not listed above. The negative test exercises
# this by aiming a request at an unbound destination and asserting the
# proxy refuses + audits the deny.
unmatched_destination_policy: deny

cache:
  ttl_seconds: 60
  max_entries: 16
  jitter_seconds: 5

audit:
  path: /var/log/agent-vault-proxy/audit.jsonl
  fail_on_unwritable: true

# Quiet preflight: the documented happy path for this harness shouldn't
# log noise. Strict mode would fail the harness if any new preflight
# warning landed; leave it advisory so the harness keeps running across
# preflight additions until we explicitly decide to tighten it.
preflight:
  fail_on_warning: false

backend:
  type: static
  config:
    type: static
    path: /etc/agent-vault-proxy/secrets.yml
