name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before filing:

        - **Out-of-scope features:** see [CONTRIBUTING.md § Scope](../blob/main/CONTRIBUTING.md) for items we're unlikely to merge (OAuth flows, AWS SigV4, multi-tenant routing, alternative storage backends).
        - **For changes that affect atomic guarantees (G1–G9):** open the issue for discussion before any PR.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? What workaround are you using?
      placeholder: |
        I need to broker an API key that's authenticated via a query parameter rather than a header (e.g. Wolfram Alpha's `?appid=` pattern). The current `inject:` block only supports headers.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like to see this solved?
      placeholder: |
        Extend the `inject:` block with a `query_param:` field, mutually exclusive with `header:`. The proxy would scan request URLs for the placeholder substring on configured bindings and substitute in-place.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you weigh?
    validations:
      required: false

  - type: textarea
    id: threat-model
    attributes:
      label: Threat-model implications
      description: |
        Does this preserve G1–G9? Does it expand the proxy's attack surface? Skip if you're not sure — we can discuss.
    validations:
      required: false
